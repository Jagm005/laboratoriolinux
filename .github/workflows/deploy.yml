name: Deploy

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar archivos al servidor
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            DESTINO="/var/www/laboratoriolinux/dev/"
          else
            DESTINO="/var/www/laboratoriolinux/"
          fi

          mkdir -p "$DESTINO"
          rsync -av --delete ./ "$DESTINO"

      - name: Crear PR dev a main y hacer merge
        if: github.ref == 'refs/heads/dev'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const head = "dev";

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head: `${owner}:${head}`,
            });

            let pr;
            if (openPrs.data.length > 0) {
              pr = openPrs.data[0];
              core.info(`PR existente encontrado: #${pr.number}`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: "Promocion automatica de dev a main",
                head,
                base,
                body: "PR creado automaticamente por el workflow de deploy.",
                maintainer_can_modify: true,
              });
              pr = created.data;
              core.info(`PR creado: #${pr.number}`);
            }

            try {
              const mergeResult = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: "merge",
              });
              core.info(`PR #${pr.number} mergeado en main: ${mergeResult.data.merged}`);
            } catch (error) {
              core.setFailed(`No se pudo hacer merge del PR #${pr.number}: ${error.message}`);
            }
          